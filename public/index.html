<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Hivemind – Magic Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --primary: #F59E0B;
        --primary-hover: #D97706;
        --bg: #090A0F;
        --surface: #13151D;
        --border: #2E3446;
        --text: #F8FAFC;
        --text-secondary: #94A3B8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #F8FAFC;
          --surface: #FFFFFF;
          --border: #E2E8F0;
          --text: #0F172A;
          --text-secondary: #475569;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }
      .logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      }
      .logo svg {
        width: 36px;
        height: 36px;
        fill: #FFFFFF;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        background-color: var(--primary);
        color: #000000;
        font-weight: 600;
        font-size: 16px;
        padding: 14px 20px;
        border-radius: 12px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }
      .btn:hover {
        background-color: var(--primary-hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .hint {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h1>Hivemind wird geöffnet…</h1>
      <p>Wir leiten dich direkt zur Hivemind App weiter, um deine Anmeldung abzuschließen.</p>
      <a id="open-app-btn" class="btn" href="#">In Hivemind App öffnen</a>
      <p class="hint">Falls sich die App nicht automatisch öffnet, tippe bitte auf den Button oben.</p>
    </div>

    <script>
      (function() {
        const fullUrl = window.location.href;
        const host = window.location.host;
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        // Intent URL specifically targeting the Android package de.mf1337.hivemind
        const intentUrl = "intent://" + host + path + search + hash + "#Intent;scheme=https;package=de.mf1337.hivemind;end;";

        const openBtn = document.getElementById('open-app-btn');
        openBtn.href = intentUrl;

        // Check if Android device
        const isAndroid = /Android/i.test(navigator.userAgent);
        if (isAndroid) {
          // Attempt automatic redirect into the app
          window.location.href = intentUrl;
        }
      })();
    </script>
  </body>
</html>
