name: Build & Test Flutter App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code (flutter analyze)
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

  build-android:
    name: Build Android (Debug & Release)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Configure Google Services
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Injecting google-services.json from secret..."
            # Check if secret is base64 encoded or plain text JSON
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{' ; then
              echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > android/app/google-services.json
            fi
          else
            echo "::warning ::GOOGLE_SERVICES_JSON secret not configured. Generating minimal dummy for build compilation..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "hivemind-ci-placeholder",
              "storage_bucket": "hivemind-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "de.mf1337.hivemind"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {
                  "analytics_service": { "status": 1 }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "::warning ::ANDROID_KEYSTORE_BASE64 secret not configured. Build will fall back to debug key."
          fi

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare hivemind-release.apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/hivemind-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hivemind-release-apk
          path: build/app/outputs/flutter-apk/hivemind-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238600c92e2609f0f37 # v2.2.1
        with:
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/hivemind-release.apk
